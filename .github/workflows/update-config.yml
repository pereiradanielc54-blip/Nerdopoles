name: Atualizar tela de configuracao

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-config.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar arte exata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          URL_B64=''
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl --fail --location --retry 3 "$URL" -o assets/nerdopoles-config.jpg
          test -s assets/nerdopoles-config.jpg
          sha256sum assets/nerdopoles-config.jpg

      - name: Salvar no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nerdopoles-config.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update exact Nerdopoles setup artwork"
          git push origin main
