name: Importar telas de sala e PeerJS
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-room-assets.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-room-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar artes e biblioteca de rede
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets vendor
          curl --fail --location --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/7584b52e-b007-491b-beba-8287947e928c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmFlYTJmODkzYTM1ZDRkNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDYyNDM5M30.w85o1XCWFnGC75nYgV2YhyqUiaxur-3KkNBGwNP3DFA' -o assets/nerdopoles-create-room.png
          curl --fail --location --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/690a01cd-29d9-409e-ad8b-ed41dd8d4366.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjE3ZjIxMzFjYmJlN2JmZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDYzNjcyMX0.rpfFKvsa0UKwVxRbGm9ZWxaqTmRhyhfQkTjoYN-DIo8' -o assets/nerdopoles-lobby.png
          curl --fail --location --retry 3 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js' -o vendor/peerjs.min.js
          test -s assets/nerdopoles-create-room.png
          test -s assets/nerdopoles-lobby.png
          test -s vendor/peerjs.min.js
      - name: Salvar no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nerdopoles-create-room.png assets/nerdopoles-lobby.png vendor/peerjs.min.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add room setup lobby art and PeerJS"
          git push origin main
