name: Gerar pecas transparentes Nerdopoles
on:
  push:
    branches: [main]
    paths: [".github/workflows/build-token-sprites.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar dependencias
        run: python -m pip install --quiet pillow numpy
      - name: Separar as seis pecas e remover o fundo quadriculado
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from collections import deque
          from pathlib import Path

          src=Image.open("assets/nerdopoles-pieces.png").convert("RGB")
          outdir=Path("assets/tokens")
          outdir.mkdir(parents=True,exist_ok=True)

          for idx in range(6):
              col,row=idx%3,idx//3
              crop=src.crop((col*512,row*512,(col+1)*512,(row+1)*512)).convert("RGBA")
              arr=np.array(crop)
              rgb=arr[:,:,:3]
              diff=rgb.max(axis=2)-rgb.min(axis=2)
              lum=rgb.mean(axis=2)
              bg=(diff<=10)&(lum>=188)

              visited=np.zeros((512,512),dtype=bool)
              q=deque()
              for x in range(512):
                  for y in (0,511):
                      if bg[y,x] and not visited[y,x]:
                          visited[y,x]=True;q.append((y,x))
              for y in range(512):
                  for x in (0,511):
                      if bg[y,x] and not visited[y,x]:
                          visited[y,x]=True;q.append((y,x))

              while q:
                  y,x=q.popleft()
                  for yy,xx in ((y-1,x),(y+1,x),(y,x-1),(y,x+1)):
                      if 0<=yy<512 and 0<=xx<512 and bg[yy,xx] and not visited[yy,xx]:
                          visited[yy,xx]=True;q.append((yy,xx))

              fg=~visited
              seen=np.zeros((512,512),dtype=bool)
              comps=[]
              for y in range(512):
                  for x in range(512):
                      if fg[y,x] and not seen[y,x]:
                          qq=deque([(y,x)]);seen[y,x]=True;pts=[]
                          while qq:
                              yy,xx=qq.popleft();pts.append((yy,xx))
                              for dy in (-1,0,1):
                                  for dx in (-1,0,1):
                                      if not (dy or dx): continue
                                      y2,x2=yy+dy,xx+dx
                                      if 0<=y2<512 and 0<=x2<512 and fg[y2,x2] and not seen[y2,x2]:
                                          seen[y2,x2]=True;qq.append((y2,x2))
                          comps.append(pts)

              comps.sort(key=len,reverse=True)
              keep=np.zeros((512,512),dtype=bool)
              for y,x in comps[0]:
                  keep[y,x]=True
              arr[:,:,3][~keep]=0

              ys,xs=np.where(keep)
              x0,x1=max(0,int(xs.min())-10),min(511,int(xs.max())+10)
              y0,y1=max(0,int(ys.min())-10),min(511,int(ys.max())+10)
              piece=Image.fromarray(arr).crop((x0,y0,x1+1,y1+1))
              scale=min(166/piece.width,166/piece.height)
              resized=piece.resize((round(piece.width*scale),round(piece.height*scale)),Image.Resampling.LANCZOS)
              canvas=Image.new("RGBA",(180,180),(0,0,0,0))
              canvas.alpha_composite(resized,((180-resized.width)//2,(180-resized.height)//2))
              canvas.save(outdir/f"token-{idx}.png",optimize=True,compress_level=9)
          PY
      - name: Salvar pecas individuais
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tokens/token-*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate transparent Nerdopoles token sprites"
          git push origin main
