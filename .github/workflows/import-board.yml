name: Importar primeiro tabuleiro

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-board.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar arte exata do tabuleiro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c25f2da4-f73f-4892-bf5b-afaf69537cac.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDY4OWVmMmNiNmJhNGNhNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU3NzU4MH0.69EOS6lqilGcnJ4JUrptawSdsIiRD68-F6TyBEsYJsQ' -o assets/nerdopoles-board-01.png
          test -s assets/nerdopoles-board-01.png
          file assets/nerdopoles-board-01.png
          sha256sum assets/nerdopoles-board-01.png

      - name: Salvar no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nerdopoles-board-01.png
          git commit -m "Add first Nerdopoles board artwork"
          git push origin main
