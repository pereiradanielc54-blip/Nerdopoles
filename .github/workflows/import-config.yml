name: Importar tela de configuracao

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-config.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar imagem original sem alteracao
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/53a67704-40a9-4ce1-b326-c3d0a11ae2fb.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODMyNDE5ZWNjNzlmYzQ4OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU1ODgyOH0.O003FTrp71wAaOkyyRiIHv2ke3m9hdRWeRpVNzvUpHI' \
            --output assets/nerdopoles-config.jpg
          test -s assets/nerdopoles-config.jpg
          file assets/nerdopoles-config.jpg
          sha256sum assets/nerdopoles-config.jpg

      - name: Salvar imagem no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nerdopoles-config.jpg
          if git diff --cached --quiet; then
            echo "A imagem ja esta salva."
            exit 0
          fi
          git commit -m "Add exact Nerdopoles match setup artwork"
          git push origin main
