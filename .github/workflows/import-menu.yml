name: Importar arte oficial do menu

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-menu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar a imagem original sem conversão
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/74790216-af7a-4107-99a1-307e7ee63777.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2U2YTVlMzA1MGFkYjY2MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU5Mjk0NH0.nuUeNeR0FFkGTwkr_Kc0Fj-KxFcnAlSB13PY7fna7oI' \
            --output assets/nerdopoles-menu.jpg
          test -s assets/nerdopoles-menu.jpg
          file assets/nerdopoles-menu.jpg
          sha256sum assets/nerdopoles-menu.jpg

      - name: Salvar a imagem no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nerdopoles-menu.jpg
          if git diff --cached --quiet; then
            echo "A imagem já está salva."
            exit 0
          fi
          git commit -m "Add exact official Nerdopoles menu artwork"
          git push origin main
