<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090012">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nerdópoles">
<title>Nerdópoles</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050008}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:manipulation;user-select:none}
#app{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 0% 50%,rgba(147,35,255,.62),rgba(99,16,185,.28) 24%,transparent 65%),radial-gradient(ellipse at 100% 50%,rgba(147,35,255,.62),rgba(99,16,185,.28) 24%,transparent 65%),#050008}
.stage{position:absolute;top:env(safe-area-inset-top,0);right:env(safe-area-inset-right,0);bottom:env(safe-area-inset-bottom,0);left:env(safe-area-inset-left,0);display:grid;place-items:center;overflow:hidden}
.frame{position:relative;width:100%;height:100%;overflow:hidden}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;-webkit-user-drag:none;pointer-events:none}
.hot,.choice,.arrow,.toggle{position:absolute;z-index:20;border:0;padding:0;margin:0;background:transparent;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#play{left:1.1%;top:18.6%;width:24.2%;height:12.1%}
#config{position:absolute;inset:0;display:none;z-index:15}
#config.on{display:block}
#back{left:1.1%;top:1.5%;width:11.2%;height:7.6%}

/* seleção visual */
.sel{box-shadow:inset 0 0 0 3px #ffd347,0 0 16px rgba(255,201,55,.8)!important}
.sel-purple{box-shadow:inset 0 0 0 3px #ff4cff,0 0 16px rgba(224,43,255,.78)!important}

/* dificuldade */
.diff{left:2.0%;width:20.2%;height:9.0%;border-radius:17px}
.diff[data-i="0"]{top:28.5%}.diff[data-i="1"]{top:38.8%}.diff[data-i="2"]{top:49.1%}.diff[data-i="3"]{top:59.5%}
.diff .desc{position:absolute;left:31%;right:4%;bottom:10%;font-size:clamp(6px,.68vw,10px);line-height:1.05;color:#f7f4ff;text-align:left;text-shadow:0 1px 3px #000}
.diff .mark{display:none;position:absolute;right:3%;top:8%;width:11%;aspect-ratio:1;border-radius:50%;background:#27c65c;color:#fff;font-weight:900;place-items:center;font-size:clamp(8px,1vw,14px)}
.diff.sel .mark{display:grid}

/* bots */
.bot{top:35.7%;width:3.1%;height:6.0%;border-radius:10px}
.bot[data-v="1"]{left:24.0%}.bot[data-v="2"]{left:27.65%}.bot[data-v="3"]{left:31.3%}.bot[data-v="4"]{left:34.95%}.bot[data-v="5"]{left:38.6%}
.bot.sel{background:rgba(255,166,0,.16)}
#botInfo{position:absolute;left:23.6%;top:43.2%;width:19.0%;height:7.8%;z-index:19;display:grid;place-items:center;text-align:center;color:#eef0ff;font-weight:800;font-size:clamp(7px,.85vw,12px);line-height:1.15;text-shadow:0 1px 2px #000;pointer-events:none}

/* mapa */
#mapPrev{left:24.0%;top:61.5%;width:3.1%;height:6.4%}
#mapNext{left:39.0%;top:61.5%;width:3.1%;height:6.4%}
#changeMap{left:25.7%;top:72.4%;width:15.0%;height:6.2%}
#mapOverlay{position:absolute;left:27.15%;top:66.55%;width:11.8%;height:6.9%;z-index:19;background:rgba(7,10,30,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.15rem .25rem;border-radius:7px;pointer-events:none}
#mapName{color:#fff;font-weight:900;font-size:clamp(7px,.85vw,12px);line-height:1.05}
#mapDesc{color:#ccd4ff;font-size:clamp(5.5px,.62vw,9px);line-height:1.05;margin-top:.18rem;text-align:center}

/* peças */
.piece{width:8.8%;height:17.1%;border-radius:16px}
.piece[data-i="0"]{left:44.25%;top:29.2%}.piece[data-i="1"]{left:53.7%;top:29.2%}.piece[data-i="2"]{left:63.1%;top:29.2%}
.piece[data-i="3"]{left:44.25%;top:49.6%}.piece[data-i="4"]{left:53.7%;top:49.6%}.piece[data-i="5"]{left:63.1%;top:49.6%}
.piece.sel-purple::after{content:"✓";position:absolute;right:5%;top:4%;width:17%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#d900ff;color:#fff;font-weight:900;font-size:clamp(8px,.9vw,13px)}
#pieceInfo{position:absolute;left:49.2%;top:22.3%;width:18.2%;height:3.8%;z-index:19;display:grid;place-items:center;color:#dfe4ff;font-size:clamp(6px,.7vw,10px);font-weight:700;text-align:center;pointer-events:none}

/* configurações */
.setting-mask{position:absolute;left:77.0%;width:19.7%;height:6.1%;z-index:18;background:rgba(13,16,45,.94);border-radius:6px}
#maskDur{top:27.9%}#maskMoney{top:35.7%}#maskBuild{top:43.7%}
.arrow{width:2.0%;height:4.1%;border-radius:7px}
#durPrev,#moneyPrev,#buildPrev{left:88.1%}
#durNext,#moneyNext,#buildNext{left:96.1%}
#durPrev,#durNext{top:29.1%}#moneyPrev,#moneyNext{top:36.9%}#buildPrev,#buildNext{top:44.9%}
.value{position:absolute;left:90.1%;width:5.9%;height:4.1%;z-index:21;display:grid;place-items:center;background:rgba(20,18,56,.98);color:#fff;font-weight:900;font-size:clamp(7px,.8vw,12px);border-radius:6px;pointer-events:none}
#durVal{top:29.1%}#moneyVal{top:36.9%}#buildVal{top:44.9%}
.descRow{position:absolute;left:78.8%;width:9.0%;z-index:21;color:#bdc8ff;font-size:clamp(5.5px,.62vw,9px);line-height:1.06;text-align:left;pointer-events:none}
#durDesc{top:31.6%}#moneyDesc{top:39.4%}#buildDesc{top:47.4%}
.toggle{left:93.45%;width:4.0%;height:4.1%;border-radius:999px;background:linear-gradient(90deg,#7c00ff,#d000ff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 10px rgba(180,0,255,.45)}
.toggle::after{content:"";position:absolute;top:8%;right:5%;width:40%;height:84%;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0008}
.toggle.off{background:#31374b;box-shadow:none}.toggle.off::after{right:55%}
#trade{top:53.25%}#auction{top:61.05%}#event{top:68.8%}
.toggleDesc{position:absolute;left:78.8%;width:13.9%;z-index:21;color:#bdc8ff;font-size:clamp(5.5px,.62vw,9px);line-height:1.05;pointer-events:none}
#tradeDesc{top:56.2%}#auctionDesc{top:64.0%}#eventDesc{top:71.7%}

/* iniciar partida */
#start{position:absolute;left:43.1%;top:78.0%;width:31.7%;height:16.0%;z-index:25;background:transparent;border:0;cursor:pointer}

#toast{position:absolute;left:50%;bottom:2.1%;transform:translate(-50%,12px);z-index:35;background:rgba(8,10,34,.96);border:1px solid #b16dff;color:#fff;padding:.4rem .75rem;border-radius:999px;font-weight:700;font-size:clamp(7px,.85vw,12px);opacity:0;transition:.16s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.rotate{display:none;position:absolute;inset:0;z-index:60;place-items:center;background:#080819;color:#fff;text-align:center;padding:28px}.rotate>div{max-width:420px;padding:24px;border-radius:22px;background:#12102a;border:1px solid #c8a7ff55}.rotate h2{margin:0 0 8px}.rotate p{margin:0;opacity:.82}
#bootUpdate{position:absolute;inset:0;z-index:120;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(109,30,190,.34),transparent 38%),#070616;color:#fff;transition:opacity .22s ease;pointer-events:auto}
#bootUpdate.hide{opacity:0;pointer-events:none}
.boot-card{min-width:min(78vw,360px);padding:22px 24px;border-radius:20px;background:rgba(17,14,43,.94);border:1px solid rgba(193,146,255,.4);box-shadow:0 20px 60px #0009;text-align:center}
.boot-logo{font-weight:1000;font-size:clamp(20px,4vw,34px);letter-spacing:.03em;color:#ffe27a;text-shadow:0 0 18px rgba(193,75,255,.45)}
.boot-status{margin-top:10px;font-size:13px;color:#d9d9ff}
.boot-spinner{width:32px;height:32px;margin:16px auto 0;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#bc5cff;animation:bootSpin .8s linear infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
@media(orientation:portrait){.rotate{display:grid}}
</style>
</head>
<body>
<main id="app">
<section id="bootUpdate" aria-live="polite">
  <div class="boot-card">
    <div class="boot-logo">NERDÓPOLES</div>
    <div id="bootStatus" class="boot-status">Verificando atualizações...</div>
    <div class="boot-spinner"></div>
  </div>
</section>
<section id="stage" class="stage">
<div id="frame" class="frame">
<img id="art" class="art" src="/assets/nerdopoles-menu.jpg" width="1536" height="864" draggable="false" fetchpriority="high" decoding="sync">
<button id="play" class="hot" type="button" aria-label="Jogar"></button>

<div id="config">
<button id="back" class="hot" type="button" aria-label="Voltar"></button>

<button class="choice diff" data-i="0" type="button"><span class="desc">Movimentos simples e decisões básicas.</span><span class="mark">✓</span></button>
<button class="choice diff" data-i="1" type="button"><span class="desc">Equilíbrio entre estratégia e pressão.</span><span class="mark">✓</span></button>
<button class="choice diff" data-i="2" type="button"><span class="desc">Bots calculam melhor compras e trocas.</span><span class="mark">✓</span></button>
<button class="choice diff" data-i="3" type="button"><span class="desc">IA agressiva e máxima competitividade.</span><span class="mark">✓</span></button>

<button class="choice bot" data-v="1" type="button"></button>
<button class="choice bot" data-v="2" type="button"></button>
<button class="choice bot" data-v="3" type="button"></button>
<button class="choice bot" data-v="4" type="button"></button>
<button class="choice bot" data-v="5" type="button"></button>
<div id="botInfo"></div>

<button id="mapPrev" class="hot" type="button"></button>
<button id="mapNext" class="hot" type="button"></button>
<button id="changeMap" class="hot" type="button"></button>
<div id="mapOverlay"><div id="mapName"></div><div id="mapDesc"></div></div>

<button class="choice piece" data-i="0" type="button"></button>
<button class="choice piece" data-i="1" type="button"></button>
<button class="choice piece" data-i="2" type="button"></button>
<button class="choice piece" data-i="3" type="button"></button>
<button class="choice piece" data-i="4" type="button"></button>
<button class="choice piece" data-i="5" type="button"></button>
<div id="pieceInfo"></div>

<div id="maskDur" class="setting-mask"></div><div id="maskMoney" class="setting-mask"></div><div id="maskBuild" class="setting-mask"></div>
<button id="durPrev" class="arrow" type="button"></button><button id="durNext" class="arrow" type="button"></button><div id="durVal" class="value"></div><div id="durDesc" class="descRow"></div>
<button id="moneyPrev" class="arrow" type="button"></button><button id="moneyNext" class="arrow" type="button"></button><div id="moneyVal" class="value"></div><div id="moneyDesc" class="descRow"></div>
<button id="buildPrev" class="arrow" type="button"></button><button id="buildNext" class="arrow" type="button"></button><div id="buildVal" class="value"></div><div id="buildDesc" class="descRow"></div>

<button id="trade" class="toggle" type="button"></button><div id="tradeDesc" class="toggleDesc"></div>
<button id="auction" class="toggle" type="button"></button><div id="auctionDesc" class="toggleDesc"></div>
<button id="event" class="toggle" type="button"></button><div id="eventDesc" class="toggleDesc"></div>

<button id="start" class="hot" type="button" aria-label="Iniciar partida"></button>
<div id="toast"></div>
</div>
</div>
</section>
<section class="rotate"><div><h2>Use o Nerdópoles em modo paisagem</h2><p>Gire o celular para a posição horizontal para continuar.</p></div></section>
</main>

<script>
(()=>{
const MENU='/assets/nerdopoles-menu.jpg',CONFIG='/assets/nerdopoles-config.jpg',BOARD='/assets/nerdopoles-board-01.png';
const difficulties=['Fácil','Normal','Difícil','Lendário'];
const pieces=['Nyan','Chapéu Mágico','Baú Nerdora','Espada Arcana','Escudo Nerdora','Dirigível'];
const maps=[
{name:'Cidade de Nerdora',desc:'Mapa equilibrado e ideal para a primeira partida.'},
{name:'Reino Celeste',desc:'Mais rotas rápidas e maior circulação pelo tabuleiro.'},
{name:'Distrito Arcano',desc:'Eventos frequentes e disputa intensa por territórios.'}
];
const durations=[
{v:'Rápida',d:'Termina mais cedo por progresso e patrimônio.'},
{v:'Clássica',d:'Segue até sobrar apenas um jogador solvente.'},
{v:'Longa',d:'Mais voltas para construir e negociar.'}
];
const money=[
{v:'1.000',d:'Começo apertado; cada compra exige cautela.'},
{v:'1.500',d:'Saldo padrão e equilibrado.'},
{v:'2.000',d:'Mais liberdade para investir no começo.'}
];
const builds=[
{v:'Rápida',d:'Construções evoluem com menos barreiras.'},
{v:'Padrão',d:'Casas e hotéis seguem as regras normais.'},
{v:'Estratégica',d:'Construir exige mais planejamento.'}
];
const defaults={difficulty:0,bots:3,piece:0,map:0,dur:1,money:1,build:1,trades:false,auctions:false,events:false};
let s={...defaults};
try{Object.assign(s,JSON.parse(localStorage.getItem('nerdopoles-config')||'{}'))}catch(_){}
const $=id=>document.getElementById(id),stage=$('stage'),frame=$('frame'),art=$('art'),play=$('play'),cfg=$('config'),toast=$('toast');
let timer;
let currentRatio=16/9;
function fit(){const w=stage.clientWidth,h=stage.clientHeight,r=currentRatio||16/9;if(!w||!h)return;let fw=w,fh=fw/r;if(fh>h){fh=h;fw=fh*r}frame.style.width=fw+'px';frame.style.height=fh+'px'}
function setArtwork(src,ratio){currentRatio=ratio;art.src=src;fit()}
function save(){try{localStorage.setItem('nerdopoles-config',JSON.stringify(s))}catch(_){}}
function note(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),900)}
function cycle(k,a,d){s[k]=(s[k]+d+a.length)%a.length;save();render()}
function render(){
document.querySelectorAll('.diff').forEach((b,i)=>b.classList.toggle('sel',i===s.difficulty));
document.querySelectorAll('.bot').forEach(b=>b.classList.toggle('sel',Number(b.dataset.v)===s.bots));
document.querySelectorAll('.piece').forEach((b,i)=>b.classList.toggle('sel-purple',i===s.piece));
$('botInfo').innerHTML='<b>'+(s.bots+1)+' jogadores</b><br>Você + '+s.bots+' '+(s.bots===1?'BOT':'BOTS')+' · mais bots = mais disputa por propriedades.';
$('mapName').textContent=maps[s.map].name;$('mapDesc').textContent=maps[s.map].desc;
$('pieceInfo').textContent='Peça selecionada: '+pieces[s.piece];
$('durVal').textContent=durations[s.dur].v;$('durDesc').textContent=durations[s.dur].d;
$('moneyVal').textContent=money[s.money].v;$('moneyDesc').textContent=money[s.money].d;
$('buildVal').textContent=builds[s.build].v;$('buildDesc').textContent=builds[s.build].d;
$('tradeDesc').textContent=s.trades?'Trocas entre jogadores permitidas.':'Trocas entre jogadores bloqueadas.';
$('auctionDesc').textContent=s.auctions?'Propriedades recusadas vão a leilão.':'Sem leilões de propriedades recusadas.';
$('eventDesc').textContent=s.events?'Cartas aleatórias entram na partida.':'Partida sem cartas de evento.';
$('trade').classList.toggle('off',!s.trades);$('auction').classList.toggle('off',!s.auctions);$('event').classList.toggle('off',!s.events);
}
function showConfig(push=false){setArtwork(CONFIG,16/9);play.hidden=true;cfg.classList.add('on');render();if(push)history.pushState({screen:'config'},'','#configuracao')}
function showMenu(push=false){setArtwork(MENU,16/9);play.hidden=false;cfg.classList.remove('on');if(push)history.pushState({screen:'menu'},'',location.pathname)}
function showBoard(push=false){setArtwork(BOARD,1536/691);play.hidden=true;cfg.classList.remove('on');if(push)history.pushState({screen:'board'},'','#tabuleiro')}
new Image().src=CONFIG;
new Image().src=BOARD;
play.addEventListener('click',()=>showConfig(true));
$('back').addEventListener('click',()=>location.hash==='#configuracao'?history.back():showMenu());
document.querySelectorAll('.diff').forEach((b,i)=>b.addEventListener('click',()=>{s.difficulty=i;save();render();note('Dificuldade: '+difficulties[i])}));
document.querySelectorAll('.bot').forEach(b=>b.addEventListener('click',()=>{s.bots=Number(b.dataset.v);save();render();note(s.bots+' '+(s.bots===1?'bot':'bots'))}));
document.querySelectorAll('.piece').forEach((b,i)=>b.addEventListener('click',()=>{s.piece=i;save();render();note('Peça: '+pieces[i])}));
$('mapPrev').onclick=()=>{cycle('map',maps,-1);note(maps[s.map].name)};$('mapNext').onclick=()=>{cycle('map',maps,1);note(maps[s.map].name)};$('changeMap').onclick=()=>{cycle('map',maps,1);note(maps[s.map].name)};
$('durPrev').onclick=()=>cycle('dur',durations,-1);$('durNext').onclick=()=>cycle('dur',durations,1);
$('moneyPrev').onclick=()=>cycle('money',money,-1);$('moneyNext').onclick=()=>cycle('money',money,1);
$('buildPrev').onclick=()=>cycle('build',builds,-1);$('buildNext').onclick=()=>cycle('build',builds,1);
function tog(k,label){s[k]=!s[k];save();render();note(label+': '+(s[k]?'ativado':'desativado'))}
$('trade').onclick=()=>tog('trades','Trocas');$('auction').onclick=()=>tog('auctions','Leilões');$('event').onclick=()=>tog('events','Cartas de evento');
$('start').onclick=()=>showBoard(true);
window.addEventListener('popstate',()=>{if(location.hash==='#tabuleiro')showBoard(false);else if(location.hash==='#configuracao')showConfig(false);else showMenu(false)});
window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);if('ResizeObserver'in window)new ResizeObserver(fit).observe(stage);fit();if(location.hash==='#tabuleiro')showBoard(false);else if(location.hash==='#configuracao')showConfig(false);else showMenu(false);
async function immersive(){try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(_){}try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(_){}}
document.addEventListener('pointerdown',immersive,{once:true,passive:true});
if('serviceWorker'in navigator){
  let reloading=false;
  const boot=document.getElementById('bootUpdate'),bootStatus=document.getElementById('bootStatus');
  const hideBoot=()=>{setTimeout(()=>{if(boot){boot.classList.add('hide');setTimeout(()=>boot.remove(),260)}},180)};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return;
    reloading=true;
    if(bootStatus)bootStatus.textContent='Atualização encontrada. Aplicando...';
    location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      if(bootStatus)bootStatus.textContent='Verificando atualizações...';
      const reg=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});
      let serverVersion=null;
      try{
        const vr=await fetch('/version.json?cold='+Date.now(),{cache:'no-store'});
        if(vr.ok)serverVersion=(await vr.json()).version||null;
      }catch(_){}
      const previous=localStorage.getItem('nerdopoles-app-version');
      await reg.update();
      if(serverVersion)localStorage.setItem('nerdopoles-app-version',serverVersion);
      if(bootStatus)bootStatus.textContent=(previous&&serverVersion&&previous!==serverVersion)?'Nova versão carregada.':'Jogo atualizado.';
      hideBoot();
    }catch(_){
      if(bootStatus)bootStatus.textContent='Abrindo versão disponível...';
      hideBoot();
    }
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){fit();immersive()}});
  window.addEventListener('focus',()=>{fit();immersive()});
}else{
  const boot=document.getElementById('bootUpdate');
  window.addEventListener('load',()=>{setTimeout(()=>boot&&boot.remove(),350)});
}
})();
</script>

<link rel="stylesheet" href="/board-v2.css?v=102">
<script src="/board-v2.js?v=103" defer></script>

</body>
</html>
