<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090012">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nerdópoles">
  <title>Nerdópoles</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#050008;
    }
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overscroll-behavior:none;
      touch-action:manipulation;
      user-select:none;
    }
    #app{
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      min-height:100svh;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:
        radial-gradient(ellipse at 0% 50%, rgba(147,35,255,.62) 0%, rgba(99,16,185,.32) 24%, rgba(29,3,48,.16) 48%, transparent 68%),
        radial-gradient(ellipse at 100% 50%, rgba(147,35,255,.62) 0%, rgba(99,16,185,.32) 24%, rgba(29,3,48,.16) 48%, transparent 68%),
        #050008;
    }
    .visual-stage{
      position:absolute;
      top:env(safe-area-inset-top,0px);
      right:env(safe-area-inset-right,0px);
      bottom:env(safe-area-inset-bottom,0px);
      left:env(safe-area-inset-left,0px);
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .art-frame{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
    }
    .screen-art{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center;
      image-rendering:auto;
      -webkit-user-drag:none;
      pointer-events:none;
    }
    .hotspot{
      position:absolute;
      z-index:10;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      cursor:pointer;
      touch-action:manipulation;
    }
    .hotspot:focus-visible{
      outline:3px solid rgba(255,255,255,.92);
      outline-offset:2px;
      border-radius:14px;
    }
    #playHotspot{
      left:1.15%;
      top:18.75%;
      width:24%;
      height:11.9%;
    }
    .rotate-lock{
      display:none;
      position:absolute;
      inset:0;
      z-index:50;
      place-items:center;
      padding:28px;
      text-align:center;
      background:
        radial-gradient(circle at 50% 36%, rgba(116,36,212,.34), transparent 44%),
        #080819;
      color:#fff;
    }
    .rotate-card{
      max-width:420px;
      padding:24px 22px;
      border:1px solid rgba(200,167,255,.35);
      border-radius:24px;
      background:#12102a;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
    }
    .rotate-icon{font-size:52px;line-height:1;margin-bottom:14px}
    .rotate-title{margin:0 0 8px;font-size:22px;font-weight:800}
    .rotate-text{margin:0;opacity:.82;line-height:1.45}
    @media (orientation:portrait){
      .rotate-lock{display:grid}
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Nerdópoles">
    <section id="visualStage" class="visual-stage" aria-label="Tela do jogo">
      <div id="artFrame" class="art-frame">
        <img
          id="screenArt"
          class="screen-art"
          src="/assets/nerdopoles-menu.jpg"
          alt="Menu principal oficial do Nerdópoles"
          width="1536"
          height="864"
          draggable="false"
          fetchpriority="high"
          decoding="sync"
        >
        <button id="playHotspot" class="hotspot" type="button" aria-label="Jogar"></button>
      </div>
    </section>

    <section class="rotate-lock" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-icon">📱↔️</div>
        <h1 class="rotate-title">Use o Nerdópoles em modo paisagem</h1>
        <p class="rotate-text">Gire o celular para a posição horizontal para continuar.</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const MENU_SRC = '/assets/nerdopoles-menu.jpg';
      const CONFIG_SRC = '/assets/nerdopoles-config.jpg';

      const stage = document.getElementById('visualStage');
      const frame = document.getElementById('artFrame');
      const screenArt = document.getElementById('screenArt');
      const playHotspot = document.getElementById('playHotspot');

      const fitArtwork = () => {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        if (!w || !h) return;

        const ratio = 16 / 9;
        let fw = w;
        let fh = fw / ratio;

        if (fh > h) {
          fh = h;
          fw = fh * ratio;
        }

        frame.style.width = fw + 'px';
        frame.style.height = fh + 'px';
      };

      const showScreen = (screen, pushHistory = false) => {
        const isConfig = screen === 'config';

        screenArt.src = isConfig ? CONFIG_SRC : MENU_SRC;
        screenArt.alt = isConfig
          ? 'Tela oficial de configuração da partida do Nerdópoles'
          : 'Menu principal oficial do Nerdópoles';

        playHotspot.hidden = isConfig;

        if (pushHistory) {
          history.pushState(
            { screen: isConfig ? 'config' : 'menu' },
            '',
            isConfig ? '#configuracao' : location.pathname
          );
        }
      };

      const configPreload = new Image();
      configPreload.src = CONFIG_SRC;

      playHotspot.addEventListener('click', () => {
        showScreen('config', true);
      });

      window.addEventListener('popstate', () => {
        showScreen(location.hash === '#configuracao' ? 'config' : 'menu');
      });

      window.addEventListener('resize', fitArtwork);
      window.addEventListener('orientationchange', fitArtwork);
      if ('ResizeObserver' in window) new ResizeObserver(fitArtwork).observe(stage);
      fitArtwork();

      showScreen(location.hash === '#configuracao' ? 'config' : 'menu');

      const tryImmersive = async () => {
        try {
          if (screen.orientation?.lock) await screen.orientation.lock('landscape');
        } catch (_) {}

        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          }
        } catch (_) {}
      };

      window.addEventListener('pageshow', () => {
        fitArtwork();
        if (window.matchMedia('(display-mode: fullscreen)').matches) {
          tryImmersive();
        }
      });

      document.addEventListener('pointerdown', tryImmersive, { once:true, passive:true });
      document.addEventListener('touchstart', tryImmersive, { once:true, passive:true });

      if (!('serviceWorker' in navigator)) return;

      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });

      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js', {
            updateViaCache: 'none'
          });

          await reg.update();

          const checkUpdate = () => reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              checkUpdate();
              fitArtwork();
              tryImmersive();
            }
          });
          window.addEventListener('focus', () => {
            checkUpdate();
            fitArtwork();
            tryImmersive();
          });
        } catch (_) {}
      });
    })();
  </script>
</body>
</html>
