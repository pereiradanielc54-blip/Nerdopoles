<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#05050b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nerdópoles">
  <title>Nerdópoles</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overscroll-behavior:none;
      touch-action:manipulation;
      user-select:none;
    }
    #app{
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      overflow:hidden;
      background:#000;
      display:grid;
      place-items:center;
    }
    .menu-art{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center;
      image-rendering:auto;
      -webkit-user-drag:none;
      pointer-events:none;
    }
    .rotate-lock{
      display:none;
      position:absolute;
      inset:0;
      z-index:50;
      place-items:center;
      padding:28px;
      text-align:center;
      background:#080819;
      color:#fff;
    }
    .rotate-card{
      max-width:420px;
      padding:24px 22px;
      border:1px solid rgba(200,167,255,.35);
      border-radius:24px;
      background:#12102a;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
    }
    .rotate-icon{font-size:52px;line-height:1;margin-bottom:14px}
    .rotate-title{margin:0 0 8px;font-size:22px;font-weight:800}
    .rotate-text{margin:0;opacity:.82;line-height:1.45}
    @media (orientation:portrait){
      .rotate-lock{display:grid}
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Menu principal do Nerdópoles">
    <img
      class="menu-art"
      src="/assets/nerdopoles-menu.jpg"
      alt="Menu principal oficial do Nerdópoles"
      width="1536"
      height="864"
      draggable="false"
      fetchpriority="high"
      decoding="sync"
    >
    <section class="rotate-lock" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-icon">📱↔️</div>
        <h1 class="rotate-title">Use o Nerdópoles em modo paisagem</h1>
        <p class="rotate-text">Gire o celular para a posição horizontal para continuar.</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      if (!('serviceWorker' in navigator)) return;

      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });

      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js', {
            updateViaCache: 'none'
          });

          await reg.update();

          const checkUpdate = () => reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkUpdate();
          });
          window.addEventListener('focus', checkUpdate);
        } catch (_) {}
      });
    })();
  </script>
</body>
</html>
